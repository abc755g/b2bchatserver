name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required files
        run: |
          set -euo pipefail
          test -f install.sh
          test -f start.sh
          test -f manage.sh
          test -f config/synapse/log.config
          test -f config/nginx/matrix-http.conf
          bash -n install.sh
          bash -n start.sh
          bash -n manage.sh

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Bootstrap-скрипт — отдельным файлом, его качают первым
          cp install.sh release-assets/install.sh
          chmod +x release-assets/install.sh

          # Архив сохраняет структуру директорий
          tar czf release-assets/b2b-chat.tar.gz \
            start.sh manage.sh config/

          (
            cd release-assets
            sha256sum install.sh b2b-chat.tar.gz > SHA256SUMS
          )

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/install.sh
            release-assets/b2b-chat.tar.gz
            release-assets/SHA256SUMS

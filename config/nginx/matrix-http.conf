# Фаза 1 — только HTTP для получения сертификата
# Принимает любой домен — конкретные имена подставляются скриптом
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Получаем SSL сертификат, подождите...';
        add_header Content-Type text/plain;
    }
}
